
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Admin Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #080e27, #172b58, #34256b);
    padding: 20px;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 40px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

.logo {
    text-align: center;
    font-size: 38px;
    margin-bottom: 10px;
}

h2 {
    color: white;
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    color: #bdc8e8;
    text-align: center;
    font-size: 14px;
    margin-bottom: 30px;
}

.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    color: #fff;
    font-size: 14px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
    font-size: 15px;
}

input::placeholder {
    color: #b4bfd9;
}

input:focus {
    border-color: #8b9dff;
    box-shadow: 0 0 0 3px rgba(139,157,255,0.15);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.toggle {
    position: absolute;
    right: 12px;
    top: 14px;
    color: #bfcaff;
    cursor: pointer;
    font-size: 13px;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    font-size: 13px;
    color: #d4dcf5;
}

.options a {
    color: #a9baff;
    text-decoration: none;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
}

.remember input {
    width: auto;
    accent-color: #7189ff;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #536dfe, #905bff);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(83,109,254,0.4);
}

.message {
    color: #ffb6b6;
    text-align: center;
    font-size: 13px;
    margin-top: 15px;
}

.footer {
    text-align: center;
    color: #aebbdc;
    font-size: 12px;
    margin-top: 30px;
}

@media(max-width: 480px) {
    .login-container {
        padding: 28px 22px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <div class="logo">🔐</div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to access your dashboard</p>

    <form id="loginForm">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password"
                       placeholder="Enter your password" required>
                <span class="toggle" onclick="togglePassword()">
                    Show
                </span>
            </div>
        </div>

        <div class="options">
            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>
            <a href="#" onclick="forgotPassword(event)">
                Forgot Password?
            </a>
        </div>

        <button type="submit" class="login-btn">
            Sign In →
        </button>

        <p class="message" id="message"></p>

    </form>

    <div class="footer">
        © 2026 Admin Portal. All rights reserved.
    </div>

</div>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const toggle = document.querySelector(".toggle");

    if (password.type === "password") {
        password.type = "text";
        toggle.textContent = "Hide";
    } else {
        password.type = "password";
        toggle.textContent = "Show";
    }
}

function forgotPassword(event) {
    event.preventDefault();
    alert("Please contact your administrator to reset your password.");
}

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    document.getElementById("message").textContent =
        "Login interface working! Connect a backend to authenticate.";
});
</script>

</body>
</html>
